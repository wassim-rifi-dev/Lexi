spring:
  application:
    name: lexi

  datasource:
    url: jdbc:postgresql://localhost:5432/lexi
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

app:
  cors:
    allowed-origins:
      - http://localhost:5173
